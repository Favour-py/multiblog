<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="navbar.css">
</head>
<body>
    <img class="search-img" src="Search_Icons_UIA.svg" alt="img">
    <section class="search">
        <input class="explore" type="text" placeholder="Explore">
        <img class="notis" src="Vector (1).svg" alt="img">
    </section>

    <section class="profiles"></section>

    <section class="posts-ctn">
        <p style="text-align:center;color:#fff;padding:40px;">Loading posts...</p>
    </section>

    <!-- New Post Button -->
    <button onclick="openNewPostModal()" style="position:fixed;bottom:30px;right:20px;background:#6c63ff;color:#fff;border:none;border-radius:50%;width:56px;height:56px;font-size:30px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.3);z-index:999;">+</button>

    <!-- New Post Modal -->
    <div id="new-post-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center;">
        <div style="background:#fff;border-radius:16px;padding:24px;width:90%;max-width:480px;">
            <h3 style="margin:0 0 16px;">New Post</h3>
            <input id="post-title" placeholder="Title" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin-bottom:10px;box-sizing:border-box;">
            <textarea id="post-content" placeholder="What's on your mind?" rows="4" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin-bottom:10px;box-sizing:border-box;resize:none;"></textarea>
            <select id="post-category" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin-bottom:10px;box-sizing:border-box;">
                <option value="other">Other</option>
                <option value="tech">Technology</option>
                <option value="lifestyle">Lifestyle</option>
                <option value="travel">Travel</option>
                <option value="food">Food</option>
            </select>
            <div style="margin-bottom:16px;">
                <label style="font-size:13px;color:#555;display:block;margin-bottom:6px;">Add Image (optional)</label>
                <input type="file" id="post-image-input" accept="image/*" style="width:100%;font-size:13px;">
                <img id="post-image-preview" src="" style="display:none;width:100%;border-radius:8px;margin-top:8px;max-height:200px;object-fit:cover;">
            </div>
            <p id="post-error" style="color:red;font-size:12px;margin-bottom:8px;"></p>
            <div style="display:flex;gap:10px;justify-content:flex-end;">
                <button type="button" onclick="closeNewPostModal()" style="padding:10px 20px;border-radius:8px;border:1px solid #ddd;cursor:pointer;">Cancel</button>
                <button type="button" onclick="submitNewPost()" style="padding:10px 20px;border-radius:8px;background:#6c63ff;color:#fff;border:none;cursor:pointer;">Post</button>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
      document.addEventListener('click', (e) => {
        if (e.target.tagName === 'A' && !e.target.href.startsWith('http')) e.preventDefault();
      });
    </script>
    <script src="home.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
