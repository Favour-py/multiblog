<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="navbar.css">
</head>
<body>
    <section class="top">
        <img class="hero-img" src="Rectangle 3310.svg" alt="img">
        <img class="menu-icon" src="Menu_Icons_UIA.svg" alt="img">
    </section>

    <section class="middle">
        <div class="profile-img-ctn">
            <img class="profile-img" src="Ellipse 221 (7).svg" alt="img">
            <span class="status-dot"></span>
        </div>
        <p class="profile-name">David Wilden</p>
        <div class="counts">
            <div class="post-counts-ctn">
                <p class="post-counts">145</p>
                <p>Posts</p>
            </div>
            <hr>
            <div class="followers-counts-ctn">
                <p class="followers-counts">12k</p>
                <p>Followers</p>
            </div>
            <hr>
            <div class="following-counts-ctn">
                <p class="following-counts">87</p>
                <p>Following</p>
            </div>
        </div>
    </section>

     <section class="posts-ctn">
        <div class="post-con">
            <div class="post1">
                <div class="top1">
                    <div class="top-left1">
                        <div class="p1-profile">
                            <img src="Ellipse 221 (1).svg" alt="img">
                        </div>
                        <div class="top-left1-info">
                            <p class="name1">Eden Vivian</p>
                            <div class="active-status-flex">
                                <p class="active-status">5 Minute(s) ago</p>
                                <img src="profile-2user.svg" alt="img">
                            </div>
                        </div>
                    </div>
                    <!-- <div class="top-right1">
                        <img src="Frame 3715.svg" alt="img">
                    </div> -->
                </div>

                    <div class="post-content">
                        <p class="post-title">This is a beautiful sky that i took
                            last week.
                        </p>
                        <img class="post-image" src="Rectangle 3301.svg" alt="img">
                    </div>

                <div class="down-section">
                    <div class="like-count-ctn">
                        <img src="heart.svg" alt="img">
                        <p class="like-count">787</p>
                    </div>
                    <div class="comment-count-ctn">
                        <img src="icons.svg" alt="img">
                        <p class="comment-count">78</p>
                    </div>
                    <div class="share-count-ctn">
                        <img src="icons (1).svg" alt="img">
                        <p class="share-count">12</p>
                    </div>
                </div>
            </div>
        </div>
    <script src="api.js"></script>
    <script src="profile.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
