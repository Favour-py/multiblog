<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="profile.css">
    <style>
        .edit-form { padding: 20px; display: grid; row-gap: 14px; }
        .edit-form input, .edit-form textarea {
            width: 100%; padding: 12px; border-radius: 12px;
            border: 1px solid #ddd; font-size: 14px; box-sizing: border-box; outline: none;
        }
        .edit-form textarea { resize: none; height: 80px; }
        .save-btn {
            background: #6c63ff; color: #fff; border: none;
            padding: 14px; border-radius: 20px; font-size: 15px;
            font-weight: 600; cursor: pointer; width: 100%;
        }
        .avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .avatar-wrap img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid #6c63ff; }
        #edit-msg { text-align: center; font-size: 13px; }
    </style>
</head>
<body>
    <section class="top">
        <img class="back" src="back.svg" alt="back" onclick="history.back()" style="cursor:pointer;">
        <p style="font-weight:700;font-size:16px;margin:auto;">Edit Profile</p>
    </section>

    <div class="edit-form">
        <div class="avatar-wrap">
            <img id="edit-avatar" src="Ellipse 221 (1).svg" alt="profile">
            <label for="edit-pic" style="cursor:pointer;color:#6c63ff;font-size:13px;">Change Photo</label>
            <input type="file" id="edit-pic" accept="image/*" style="display:none;">
        </div>
        <input id="edit-firstname" type="text" placeholder="First Name">
        <input id="edit-lastname" type="text" placeholder="Last Name">
        <textarea id="edit-bio" placeholder="Bio"></textarea>
        <p id="edit-msg"></p>
        <button class="save-btn" type="button" onclick="saveProfile()">Save Changes</button>
    </div>

    <script src="api.js"></script>
    <script src="edit_profile.js"></script>
</body>
</html>
