<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="profile.css">
    <style>
        .edit-top {
            position: relative;
            width: 100%;
        }
        .edit-hero {
            width: 115%;
            display: block;
        }
        .edit-avatar-wrap {
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .edit-avatar-wrap img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #6c63ff;
            background: #eee;
        }
        .edit-form {
            margin-top: 55px;
            padding: 20px;
            display: grid;
            row-gap: 14px;
        }
        .edit-form input, .edit-form textarea {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .edit-form textarea { resize: none; height: 80px; }
        .save-btn {
            background: #6c63ff;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        #edit-msg { text-align: center; font-size: 13px; }
        .change-photo-label {
            margin-top: 6px;
            cursor: pointer;
            color: #6c63ff;
            font-size: 13px;
            background: #fff;
            padding: 4px 12px;
            border-radius: 12px;
        }
        .edit-page-top {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.15);
        }
        .edit-page-top p {
            font-weight: 700;
            font-size: 16px;
            margin: auto;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="edit-page-top">
        <img src="back.svg" alt="back" onclick="history.back()" style="cursor:pointer;width:24px;">
        <p>Edit Profile</p>
    </div>

    <div class="edit-top">
        <img class="edit-hero" src="Rectangle 3310.svg" alt="">
        <div class="edit-avatar-wrap">
            <img id="edit-avatar" src="Ellipse 221 (1).svg" alt="profile">
            <label for="edit-pic" class="change-photo-label">Change Photo</label>
            <input type="file" id="edit-pic" accept="image/*" style="display:none;">
        </div>
    </div>

    <div class="edit-form">
        <input id="edit-firstname" type="text" placeholder="First Name">
        <input id="edit-lastname" type="text" placeholder="Last Name">
        <textarea id="edit-bio" placeholder="Bio"></textarea>
        <p id="edit-msg"></p>
        <button class="save-btn" type="button" onclick="saveProfile()">Save Changes</button>
    </div>

    <script src="api.js"></script>
    <script src="edit_profile.js"></script>
</body>
</html>
