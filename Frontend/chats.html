<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chats</title>
    <link rel="stylesheet" href="chats.css">
</head>
<body>
    <section class="top-section">
        <img class="back" src="back.svg" alt="img">
        <div class="profile-status">
            <img class="user-img" src="Ellipse 221 (1).svg" alt="img">
            <div class="profile-status-grid">
                <p class="profile-name">Eden Vindian</p>
                <p class="active-status">Active Now</p>
            </div>
        </div>
        <div class="profile-images-flex">
            <img src="call.svg" alt="img">
            <img src="video.svg" alt="img">
            <img src="Frame 3715.svg" alt="img">
        </div>
    </section>

    <section class="main-section">
        <div class="chat1">
            <p>Hello, have a great day! &#128156</p>
        </div>
        <div class="chat2">
            <p>Thank you broo! &#128157</p>
        </div>
        <div class="chat1">
            <p>Hope that u can remember who i am in tomorrow! &#128156</p>
        </div>
        <div class="chat2">
            <p>What’s wrong to you?! &#128528</p>
        </div>
        <div class="chat2">
            <p>Are you okay? &#128550</p>
        </div>
        <div class="chat1">
            <p>I had a dream, at one day, no one know who i am... &#128552</p>
        </div>
        <div class="chat1">
            <p>I feel extremely scare &#128554</p>
        </div>
        <div class="chat2">
            <p>I understand</p>
        </div>
    </section>
    
    <section class="inputs">
        <img class="gallery" src="gallery-add.svg" alt="img">
        <img class="voice" src="microphone-2.svg" alt="img">
        <div class="input-div">
            <input class="text" type="text" placeholder="Enter Message...">
            <img class="send" src="Send_Submit_Success_Icon_UIA.svg" alt="img">
        </div>
    </section>
    <script src="api.js"></script>
    <script src="chats.js"></script>
</body>
</html>
