<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <main>
        <section class="main-section">
            <h1>Sign Up</h1>
            <form id="signup-form" onsubmit="return false;">
                <!-- Profile Picture Upload -->
                <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:10px;">
                    <div id="avatar-preview" style="width:80px;height:80px;border-radius:50%;background:#ccc;overflow:hidden;margin-bottom:8px;border:3px solid #fff;">
                        <img id="avatar-img" src="Ellipse 221 (1).svg" style="width:100%;height:100%;object-fit:cover;">
                    </div>
                    <label for="profile-pic" style="cursor:pointer;color:#fff;font-size:13px;text-decoration:underline;">Upload Profile Picture</label>
                    <input type="file" id="profile-pic" accept="image/*" style="display:none;">
                </div>
                <div class="name">
                    <input class="fname" type="text" placeholder="First Name" required>
                    <input class="lname" type="text" placeholder="Last Name" required>
                </div>
                <input class="username" type="text" placeholder="Username" required>
                <input class="email" type="email" placeholder="Email" required>
                <div class="pass1">
                    <input class="password" type="password" placeholder="Password" required>
                    <img class="eye1" src="eye-slash.svg" alt="img">
                </div>
                <div class="pass2">
                    <input class="cpassword" type="password" placeholder="Confirm Password" required>
                    <img class="eye2" src="eye-slash.svg" alt="img">
                </div>
                <label class="age" for="">Date of Birth</label>
                <input class="date" type="date">
                <label class="lgender" for="gender">Gender</label>
                <div class="gender">
                   <label><input class="male" type="radio" name="radio">Male</label>
                   <label><input class="female" type="radio" name="radio">Female</label>
                   <label><input class="other" type="radio" name="radio">Other</label>
                </div>
                <label class="privacy"><input class="cprivacy" type="checkbox">I agree with Privacy and Policy</label>
                <button class="signup-btn" type="button" id="signup-btn">Sign Up</button>
                <div id="signup-message" style="font-size:13px;margin-top:8px;text-align:center;"></div>
            </form>
            <div class="down-section">
                <p class="already">Already have an account?</p>
                <p><a class="signin" href="/signin/">Sign In</a></p>
            </div>
        </section>
    </main>
    <script src="api.js"></script>
    <script src="signup.js"></script>
</body>
</html>
